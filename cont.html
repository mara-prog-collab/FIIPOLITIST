<!doctype html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0D1A2E"><title>Contul meu — Fii Polițist.Ro</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="enhancements.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">FP</span><span>Fii Polițist<span class="brand-dot">.Ro</span></span></a><nav class="desktop-nav"><a href="examene.html">Examene</a><a href="dashboard.html">Dashboard</a><a href="abonament.html">PRO</a></nav></div></header><main><section class="section"><div class="container" style="max-width:820px"><span class="section-kicker">Contul meu</span><h1>Setările contului</h1><div class="dashboard-grid"><section class="dash-panel"><div class="dash-panel-top"><strong>Datele tale</strong><span id="accountStatus">—</span></div><p><b>Email</b><br><span id="email">—</span></p><p><b>Nume</b><br><span id="name">—</span></p><p><b>Examen</b><br><span id="exam">—</span></p><button class="btn btn-outline" onclick="signOut()">Ieși din cont</button></section><section class="dash-panel"><div class="dash-panel-top"><strong>Abonament</strong><span id="proBadge">FREE</span></div><h2 id="plan">Plan gratuit</h2><p id="subText">Ai acces la funcțiile gratuite ale platformei.</p><a class="btn btn-primary" href="abonament.html" id="proBtn">Vezi PRO — 15 lei/lună</a><p><button class="switch" id="portalBtn" onclick="portal()">Administrează abonamentul</button></p></section></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="data/supabase.js"></script><script src="data/pro.js"></script><script>async function load(){const c=getSupabase();if(!c){location.href='auth.html';return}const u=await fpUser();if(!u){location.href='auth.html?next=cont.html';return}email.textContent=u.email||'—';name.textContent=u.user_metadata?.full_name||'—';const p=JSON.parse(localStorage.getItem('fp_exam')||'{}');exam.textContent=p.name||'Nu ai ales încă';const active=await fpRefreshPro();accountStatus.textContent=active?'PRO activ':'Cont activ';if(active){proBadge.textContent='PRO';plan.textContent='Fii Polițist.Ro PRO';subText.textContent='Ai acces la funcțiile PRO.';proBtn.textContent='Vezi detalii PRO';}}</script><script>async function signOut(){const c=getSupabase();if(c)await c.auth.signOut();localStorage.removeItem('fp_pro');location.href='index.html'}async function portal(){const c=getSupabase();const s=await c.auth.getSession();if(!s.data.session){location.href='auth.html?next=cont.html';return}const r=await fetch('/api/create-portal-session',{method:'POST',headers:{Authorization:'Bearer '+s.data.session.access_token}});const d=await r.json();if(d.url)location.href=d.url;else alert(d.error||'Portal indisponibil.');}load();</script></body></html>
