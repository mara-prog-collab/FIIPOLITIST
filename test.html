<!doctype html>
<html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0D1A2E"><title>Test grilă — Fii Polițist.Ro</title><link rel="stylesheet" href="styles.css"><style>.question-tools{display:flex;justify-content:space-between;gap:12px;align-items:center}.favorite{border:1px solid #dfe5ee;background:#fff;color:#536176;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700}.favorite.active{border-color:#1F59C7;color:#1F59C7}.question-id{font-size:10px;color:#8995a7}.db-note{font-size:11px;color:#68758a;margin-top:8px}</style></head>
<body><header class="site-header"><div class="container nav"><a class="brand" href="dashboard.html"><span class="brand-mark">FP</span><span>Fii Polițist<span class="brand-dot">.Ro</span></span></a><span id="testTitle" class="test-title">Test grilă</span><span id="timer" class="timer-chip">10:00</span></div></header>
<main><section class="section test-page"><div class="container test-container"><div class="test-meta"><span id="counter"></span><span id="examName"></span></div><div class="test-track"><i id="track"></i></div><div class="test-box"><div class="question-tools"><span class="section-kicker">Grilă de antrenament</span><button id="favorite" class="favorite" type="button">☆ Salvează</button></div><div class="question-id" id="questionId"></div><div class="db-note">Întrebări originale construite după tematica oficială MAI și tipologia publică a subiectelor Academiei de Poliție 2024–2026.</div><h1 id="question"></h1><div id="answers" class="answers"></div><div id="explanation" class="explanation hidden"></div><div class="test-actions"><a class="btn btn-ghost" href="dashboard.html">Ieși din test</a><button id="next" class="btn btn-primary">Următoarea →</button></div></div></div></section></main>
<script src="data/exams.js"></script><script src="data/romana.js"></script><script src="data/vocabular.js"></script><script src="data/morfologie.js"></script><script src="data/sintaxa.js"></script><script src="data/ortografie.js"></script><script src="data/ortoepie.js"></script><script src="data/intelegerea.js"></script><script src="data/questions.js"></script><script>
const params=new URLSearchParams(location.search),key=params.get('exam')||getSelectedExamKey(),subject=params.get('subject'),exam=EXAMS[key]||EXAMS.campina;setSelectedExamKey(key);let qs=subject?questionsForSubject(subject):QUESTIONS.filter(q=>q.subject==='romana').slice(0,10);if(!qs.length)qs=QUESTIONS.slice(0,5);let i=0,score=0,chosen=null,seconds=600,answered=false,interval;
const favKey='fp_favorites',wrongKey='fp_wrong';const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),qid=x=>x.id||x.q;
function fav(x){return read(favKey).some(v=>v.id===qid(x))}function toggleFav(x){let a=read(favKey),id=qid(x);a=fav(x)?a.filter(v=>v.id!==id):a.concat([{id,q:x.q,a:x.a,c:x.c,e:x.e,exam:exam.name}]);write(favKey,a);renderFav(x)}function renderFav(x){let b=document.getElementById('favorite'),on=fav(x);b.classList.toggle('active',on);b.textContent=on?'★ Salvat':'☆ Salvează'}
function wrong(x){let a=read(wrongKey),id=qid(x);if(!a.some(v=>v.id===id))a.push({id,q:x.q,a:x.a,c:x.c,e:x.e,exam:exam.name});write(wrongKey,a)}
function render(){answered=false;chosen=null;let x=qs[i];document.getElementById('counter').textContent=`Întrebarea ${i+1} din ${qs.length}`;document.getElementById('examName').textContent=exam.name;document.getElementById('questionId').textContent='ID '+x.id;document.getElementById('track').style.width=((i+1)/qs.length*100)+'%';document.getElementById('question').textContent=x.q;document.getElementById('answers').innerHTML=x.a.map((v,n)=>`<button class="answer" data-i="${n}"><b>${String.fromCharCode(65+n)}</b>${v}</button>`).join('');document.getElementById('explanation').classList.add('hidden');document.getElementById('next').textContent=i===qs.length-1?'Vezi rezultatul →':'Următoarea →';renderFav(x);document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;chosen=+b.dataset.i;document.querySelectorAll('.answer').forEach(z=>z.classList.remove('selected'));b.classList.add('selected')})}
function finish(){clearInterval(interval);let pct=Math.round(score/qs.length*100),p=JSON.parse(localStorage.getItem('fp_progress')||'{"tests":0,"questions":0,"correct":0}');p.tests=(p.tests||0)+1;p.questions=(p.questions||0)+qs.length;p.correct=(p.correct||0)+score;p.lastScore=pct;p.exam=exam.name;localStorage.setItem('fp_progress',JSON.stringify(p));location.href=`rezultat.html?score=${score}&total=${qs.length}&exam=${encodeURIComponent(exam.name)}`}
document.getElementById('favorite').onclick=()=>toggleFav(qs[i]);document.getElementById('next').onclick=()=>{if(chosen===null){alert('Alege un răspuns pentru a continua.');return}answered=true;let x=qs[i];if(chosen===x.c)score++;else wrong(x);let e=document.getElementById('explanation');e.textContent=x.e;e.classList.remove('hidden');if(i<qs.length-1)setTimeout(()=>{i++;render()},450);else setTimeout(finish,450)};function tick(){seconds--;document.getElementById('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds<=0)finish()}render();interval=setInterval(tick,1000);
</script></body></html>
