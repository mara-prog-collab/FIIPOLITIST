<!doctype html>
<html lang="ro">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0D1A2E"><title>Test grilă — Fii Polițist.Ro</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="site-header"><div class="container nav"><a class="brand" href="dashboard.html"><span class="brand-mark">FP</span><span>Fii Polițist<span class="brand-dot">.Ro</span></span></a><span id="testTitle" class="test-title">Test grilă</span><span id="timer" class="timer-chip">10:00</span></div></header>
<main><section class="section test-page"><div class="container test-container"><div class="test-meta"><span id="counter">Întrebarea 1 din 5</span><span id="examName">Pregătire admitere</span></div><div class="test-track"><i id="track"></i></div><div class="test-box"><span class="section-kicker">Grilă de antrenament</span><h1 id="question"></h1><div id="answers" class="answers"></div><div id="explanation" class="explanation hidden"></div><div class="test-actions"><a class="btn btn-ghost" href="dashboard.html">Ieși din test</a><button id="next" class="btn btn-primary">Următoarea →</button></div></div></div></section></main>
<script src="data/exams.js"></script><script src="data/questions.js"></script><script>
const params=new URLSearchParams(location.search);const key=params.get('exam')||getSelectedExamKey();const subject=params.get('subject');const exam=EXAMS[key]||EXAMS.campina;setSelectedExamKey(key);localStorage.setItem('fp_exam',JSON.stringify({key,name:exam.name,place:exam.shortName}));let qs=subject?questionsForSubject(subject):QUESTIONS.slice(0,5);if(!qs.length)qs=QUESTIONS.slice(0,5);let i=0,score=0,chosen=null,seconds=600,interval,answered=false;
document.getElementById('examName').textContent=exam.name;document.getElementById('testTitle').textContent=subject?(exam.subjects.find(s=>s.id===subject)?.name||'Test grilă'):'Test grilă';
function render(){answered=false;chosen=null;const x=qs[i];document.getElementById('counter').textContent=`Întrebarea ${i+1} din ${qs.length}`;document.getElementById('track').style.width=((i+1)/qs.length*100)+'%';document.getElementById('question').textContent=x.q;document.getElementById('answers').innerHTML=x.a.map((v,n)=>`<button class="answer" data-i="${n}"><b>${String.fromCharCode(65+n)}</b>${v}</button>`).join('');document.getElementById('explanation').classList.add('hidden');document.getElementById('next').textContent=i===qs.length-1?'Vezi rezultatul →':'Următoarea →';document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;chosen=Number(b.dataset.i);document.querySelectorAll('.answer').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')})}
function finish(){clearInterval(interval);const pct=Math.round(score/qs.length*100);const p=JSON.parse(localStorage.getItem('fp_progress')||'{"tests":0,"questions":0,"correct":0}');p.tests=(p.tests||0)+1;p.questions=(p.questions||0)+qs.length;p.correct=(p.correct||0)+score;p.lastScore=pct;p.exam=exam.name;localStorage.setItem('fp_progress',JSON.stringify(p));location.href=`rezultat.html?score=${score}&total=${qs.length}&exam=${encodeURIComponent(exam.name)}`}
function tick(){seconds--;document.getElementById('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds<=0)finish()}
document.getElementById('next').onclick=()=>{if(chosen===null){alert('Alege un răspuns pentru a continua.');return}answered=true;if(chosen===qs[i].c)score++;const exp=document.getElementById('explanation');exp.textContent=qs[i].e;exp.classList.remove('hidden');if(i<qs.length-1){setTimeout(()=>{i++;render()},500)}else setTimeout(finish,500)};
render();interval=setInterval(tick,1000);
</script></body></html>
