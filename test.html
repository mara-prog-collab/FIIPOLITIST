<!doctype html>
<html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0D1A2E"><title>Test grilă — Fii Polițist.Ro</title><link rel="manifest" href="manifest.webmanifest"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><div class="container nav"><a class="brand" href="dashboard.html"><span class="brand-mark">FP</span><span>Fii Polițist<span class="brand-dot">.Ro</span></span></a><span class="test-title">Test demo</span><span id="timer" class="timer-chip">05:00</span></div></header>
<main><section class="section test-page"><div class="container test-container"><div class="test-meta"><span id="counter">Întrebarea 1 din 5</span><span id="examName">Pregătire admitere</span></div><div class="test-track"><i id="track"></i></div><div class="test-box"><span class="section-kicker">Grilă de antrenament</span><h1 id="question"></h1><div id="answers" class="answers"></div><div id="explanation" class="explanation hidden"></div><div class="test-actions"><a class="btn btn-ghost" href="dashboard.html">Ieși din test</a><button id="next" class="btn btn-primary">Următoarea →</button></div></div></div></section></main>
<script>const qs=[{q:'Care variantă este corectă din punct de vedere gramatical?',a:['Fii atent la întrebare.','Fi atent la întrebare.','Fii-atent la întrebare.','Fii atentă la întrebare.'],c:0,e:'Forma corectă a imperativului afirmativ este „fii”.'},{q:'Care este scopul principal al unei simulări de examen?',a:['Să înlocuiască învățarea','Să exerseze condițiile de examen','Să ofere doar întrebări ușoare','Să elimine timpul limitat'],c:1,e:'Simularea te ajută să exersezi în condiții cât mai apropiate de examen.'},{q:'Ce este util să faci după o întrebare greșită?',a:['Să o ignori','Să închei testul','Să verifici explicația și să o repeți','Să ștergi rezultatul'],c:2,e:'Analizarea greșelilor te ajută să consolidezi informația.'},{q:'Ce indicator arată cel mai simplu evoluția ta?',a:['Numărul de tab-uri','Acuratețea răspunsurilor','Lungimea parolei','Culoarea paginii'],c:1,e:'Acuratețea arată proporția răspunsurilor corecte și permite compararea rezultatelor.'},{q:'Care este prețul planului PRO prezentat pe platformă?',a:['5 lei/lună','10 lei/lună','15 lei/lună','30 lei/lună'],c:2,e:'Planul PRO este prezentat la 15 lei/lună.'}];let i=0,score=0,chosen=null,seconds=300,interval;const qEl=document.getElementById('question'),aEl=document.getElementById('answers'),next=document.getElementById('next');function render(){chosen=null;const x=qs[i];document.getElementById('counter').textContent=`Întrebarea ${i+1} din ${qs.length}`;document.getElementById('track').style.width=((i+1)/qs.length*100)+'%';qEl.textContent=x.q;aEl.innerHTML=x.a.map((v,n)=>`<button class="answer" data-i="${n}"><b>${String.fromCharCode(65+n)}</b>${v}</button>`).join('');document.getElementById('explanation').classList.add('hidden');next.textContent=i===qs.length-1?'Vezi rezultatul →':'Următoarea →';aEl.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.i);aEl.querySelectorAll('.answer').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')})}function finish(){clearInterval(interval);const pct=Math.round(score/qs.length*100),p=JSON.parse(localStorage.getItem('fp_progress')||'{"tests":0,"questions":0,"correct":0}');p.tests=(p.tests||0)+1;p.questions=(p.questions||0)+qs.length;p.correct=(p.correct||0)+score;p.lastScore=pct;localStorage.setItem('fp_progress',JSON.stringify(p));location.href='rezultat.html?score='+score+'&total='+qs.length}next.onclick=()=>{if(chosen===null){alert('Alege un răspuns pentru a continua.');return}if(chosen===qs[i].c)score++;if(i<qs.length-1){i++;render()}else finish()};function tick(){seconds--;document.getElementById('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds<=0)finish()}render();interval=setInterval(tick,1000);</script></body></html>
