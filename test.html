<!doctype html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0D1A2E"><title>Test grilă — Fii Polițist.Ro</title><link rel="stylesheet" href="styles.css"><style>.question-tools{display:flex;justify-content:space-between;gap:12px;align-items:center}.favorite{border:1px solid #dfe5ee;background:#fff;color:#536176;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700}.favorite.active{border-color:#1F59C7;color:#1F59C7}.question-id{font-size:10px;color:#8995a7}.db-note{font-size:11px;color:#68758a;margin-top:8px}</style></head><body><header class="site-header"><div class="container nav"><a class="brand" href="dashboard.html"><span class="brand-mark">FP</span><span>Fii Polițist<span class="brand-dot">.Ro</span></span></a><span id="testTitle" class="test-title">Test grilă</span><span id="timer" class="timer-chip">10:00</span></div></header><main><section class="section test-page"><div class="container test-container"><div class="test-meta"><span id="counter"></span><span id="examName"></span></div><div class="test-track"><i id="track"></i></div><div class="test-box"><div class="question-tools"><span class="section-kicker">Grilă de antrenament</span><button id="favorite" class="favorite" type="button">☆ Salvează</button></div><div class="question-id" id="questionId"></div><div class="db-note">Întrebări originale construite după tematica oficială și tipologia publică a subiectelor de admitere.</div><h1 id="question"></h1><div id="answers" class="answers"></div><div id="explanation" class="explanation hidden"></div><div class="test-actions"><a class="btn btn-ghost" href="dashboard.html">Ieși din test</a><button id="next" class="btn btn-primary">Următoarea →</button></div></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="data/supabase.js"></script><script src="data/exams.js"></script><script src="data/romana.js"></script><script src="data/vocabular.js"></script><script src="data/morfologie.js"></script><script src="data/sintaxa.js"></script><script src="data/ortografie.js"></script><script src="data/ortoepie.js"></script><script src="data/intelegerea.js"></script><script src="data/engleza.js"></script><script src="data/istorie.js"></script><script src="data/logica.js"></script><script src="data/educatie-civica.js"></script><script src="data/legislatie.js"></script><script src="data/matematica.js"></script><script src="data/fizica.js"></script><script src="data/questions.js"></script><script>const params=new URLSearchParams(location.search),key=params.get('exam')||getSelectedExamKey(),subject=params.get('subject'),exam=EXAMS[key]||EXAMS.campina;setSelectedExamKey(key);let qs=subject?questionsForSubject(subject):QUESTIONS.filter(q=>q.subject==='romana').slice(0,10);if(!qs.length)qs=QUESTIONS.slice(0,5);qs=[...qs].sort(()=>Math.random()-.5);let i=0,score=0,chosen=null,seconds=600,answered=false,interval;const favKey='fp_favorites',wrongKey='fp_wrong';const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),qid=x=>x.id||x.q;function fav(x){return read(favKey).some(v=>v.id===qid(x))}async function toggleFav(x){let a=read(favKey),id=qid(x),on=fav(x);a=on?a.filter(v=>v.id!==id):a.concat([{id,q:x.q,a:x.a,c:x.c,e:x.e,exam:exam.name}]);write(favKey,a);try{await fpToggleFavorite(id,!on)}catch(e){}renderFav(x)}function renderFav(x){let b=document.getElementById('favorite'),on=fav(x);b.classList.toggle('active',on);b.textContent=on?'★ Salvat':'☆ Salvează'}async function wrong(x){let a=read(wrongKey),id=qid(x);if(!a.some(v=>v.id===id))a.push({id,q:x.q,a:x.a,c:x.c,e:x.e,exam:exam.name});write(wrongKey,a);try{await fpToggleWrong(id,true)}catch(e){}}function render(){answered=false;chosen=null;let x=qs[i];document.getElementById('counter').textContent=`Întrebarea ${i+1} din ${qs.length}`;document.getElementById('examName').textContent=exam.name;document.getElementById('questionId').textContent='ID '+x.id;document.getElementById('track').style.width=((i+1)/qs.length*100)+'%';document.getElementById('question').textContent=x.q;document.getElementById('answers').innerHTML=x.a.map((v,n)=>`<button class="answer" data-i="${n}"><b>${String.fromCharCode(65+n)}</b>${v}</button>`).join('');document.getElementById('explanation').classList.add('hidden');document.getElementById('next').textContent=i===qs.length-1?'Vezi rezultatul →':'Următoarea →';renderFav(x);document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;chosen=+b.dataset.i;document.querySelectorAll('.answer').forEach(z=>z.classList.remove('selected'));b.classList.add('selected')})}async function finish(){clearInterval(interval);let pct=Math.round(score/qs.length*100),p=JSON.parse(localStorage.getItem('fp_progress')||'{"tests":0,"questions":0,"correct":0}');p.tests=(p.tests||0)+1;p.questions=(p.questions||0)+qs.length;p.correct=(p.correct||0)+score;p.lastScore=pct;p.exam=exam.name;localStorage.setItem('fp_progress',JSON.stringify(p));try{await fpSaveAttempt({examKey:key,mode:subject?'subject-test':'test',totalQuestions:qs.length,correctAnswers:score,score:pct,durationSeconds:600-seconds},qs.map(x=>({id:x.id,q:x.q,a:x.a,c:x.c,e:x.e,subject:x.subject,chapter:x.chapter,selected:x._selected,correct:x._selected===x.c})));for(const s of [...new Set(qs.map(x=>x.subject).filter(Boolean))]){const done=qs.filter(x=>x.subject===s).length,ok=qs.filter(x=>x.subject===s&&x._selected===x.c).length;await fpSaveProgress(key,s,done,ok,1)}}catch(e){}const out=new URL('rezultat.html',location.href);out.searchParams.set('score',score);out.searchParams.set('total',qs.length);out.searchParams.set('exam',exam.name);out.searchParams.set('examKey',key);if(subject)out.searchParams.set('subject',subject);location.href=out.toString()}document.getElementById('favorite').onclick=()=>toggleFav(qs[i]);document.getElementById('next').onclick=async()=>{if(chosen===null){alert('Alege un răspuns pentru a continua.');return}answered=true;let x=qs[i];x._selected=chosen;if(chosen===x.c)score++;else await wrong(x);let e=document.getElementById('explanation');e.textContent=x.e;e.classList.remove('hidden');if(i<qs.length-1)setTimeout(()=>{i++;render()},450);else setTimeout(finish,450)};function tick(){seconds--;document.getElementById('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds<=0)finish()}render();interval=setInterval(tick,1000);</script></body></html>
